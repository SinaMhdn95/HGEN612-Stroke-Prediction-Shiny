name: R checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::glmnet
            any::janitor
            any::ranger
            any::readr
            any::themis
            any::tidymodels
            any::tidyr
            any::xgboost
      - name: Run privacy check
        run: bash scripts/privacy_check.sh
      - name: Run smoke test
        run: Rscript tests/smoke_test.R
