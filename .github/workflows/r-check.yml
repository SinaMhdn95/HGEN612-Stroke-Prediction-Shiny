name: Project structure check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  original-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify original Shiny project files
        shell: bash
        run: |
          set -euo pipefail
          test -f Final_Sina.Rproj
          test -f Final3_Sina.Rmd
          test -f healthcare.csv
          test -f lr_model.rds
          test -f rf_model.rds
          test -f xgb_model.rds
          test -f stroke7.png
          test -f stroke.mp4
          ! find . -type f \( -name '*.Renviron*' -o -name '*recovery*' \) -print -quit | grep -q .
